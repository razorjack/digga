name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Validate the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node scripts/release-version.ts "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
            extension: dmg
            suffix: -arm64
          - runner: ubuntu-24.04
            target: linux-x64
            extension: AppImage
            suffix: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci

      - name: Set the packaged version without committing or tagging
        run: npm version "$VERSION" --no-git-tag-version --ignore-scripts --allow-same-version

      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium

      - name: Prepare Linux for the packaged app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 xvfb lsof
          # The ephemeral runner must allow Electron's unprivileged namespace sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Package, health-check and test on macOS
        if: runner.os == 'macOS'
        run: npx vp run e2e:packaged

      - name: Package, health-check and test on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npx vp run e2e:packaged

      - name: Collect the installer
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir artifacts
          cp "release/Digga-${VERSION}${SUFFIX}.${EXTENSION}" "artifacts/Digga-${VERSION}-${TARGET}.${EXTENSION}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-failure-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/e2e/
            release/builder-debug.yml
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [version, verify, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ contains(needs.version.outputs.version, '-') }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: artifacts
          merge-multiple: true

      - name: Check both installers and calculate checksums
        working-directory: artifacts
        run: |
          test -s "Digga-${VERSION}-macos-arm64.dmg"
          test -s "Digga-${VERSION}-linux-x64.AppImage"
          sha256sum "Digga-${VERSION}-macos-arm64.dmg" "Digga-${VERSION}-linux-x64.AppImage" > SHA256SUMS

      - name: Upload to a draft, then publish the complete release
        working-directory: artifacts
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft"; then
            if [ "$(cat "$RUNNER_TEMP/release-draft")" != true ]; then
              echo "Release $TAG is already published; refusing to replace its assets." >&2
              exit 1
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes --prerelease="$PRERELEASE"
          fi
          gh release upload "$TAG" "Digga-${VERSION}-macos-arm64.dmg" "Digga-${VERSION}-linux-x64.AppImage" SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE"
